<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>move — diana olifirova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
    --black: #000;
    --white: #f2f2f2;
    --grey: #6f6f6f;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { background: var(--black); }
body {
    font-family: 'Inter', Helvetica, Arial, sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

/* ---------- corners ---------- */
.corner {
    position: fixed;
    z-index: 10;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    mix-blend-mode: difference;
}
.corner.tl { top: 22px; left: 24px; }
.corner.tr { top: 22px; right: 24px; text-align: right; }
.corner.bl { bottom: 22px; left: 24px; color: var(--grey); }
.corner a:hover { text-decoration: underline; text-underline-offset: 4px; }

h1 {
    position: fixed;
    z-index: 10;
    left: 24px;
    bottom: 60px;
    font-weight: 300;
    font-size: clamp(64px, 14vw, 200px);
    line-height: 0.85;
    letter-spacing: -0.04em;
    text-transform: lowercase;
    mix-blend-mode: difference;
    pointer-events: none;
}

/* ---------- the chaos ---------- */
.field {
    position: relative;
    width: 100%;
    height: 420vh;
}
.clip {
    position: absolute;
    display: block;
    overflow: hidden;
    background: #0a0a0a;
    transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.clip video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(0.25) contrast(1.05);
    transition: filter 0.8s ease;
}
.clip:hover video { filter: none; }
.clip:hover { z-index: 5; }
.clip .n {
    position: absolute;
    left: 10px;
    top: 8px;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--white);
    mix-blend-mode: difference;
}

/* sizes and places, as if thrown */
.clip.c1 { left: 4vw;  top: 6vh;   width: 34vw; aspect-ratio: 9 / 16; }
.clip.c2 { left: 46vw; top: 2vh;   width: 24vw; aspect-ratio: 9 / 16; transform: rotate(1.5deg); }
.clip.c3 { left: 64vw; top: 44vh;  width: 32vw; aspect-ratio: 9 / 16; }
.clip.c4 { left: 14vw; top: 82vh;  width: 42vw; aspect-ratio: 9 / 16; transform: rotate(-1deg); }
.clip.c5 { left: 58vw; top: 128vh; width: 22vw; aspect-ratio: 9 / 16; }
.clip.c6 { left: 2vw;  top: 178vh; width: 26vw; aspect-ratio: 9 / 16; transform: rotate(2deg); }
.clip.c7 { left: 36vw; top: 196vh; width: 50vw; aspect-ratio: 9 / 16; }
.clip.c8 { left: 6vw;  top: 262vh; width: 30vw; aspect-ratio: 9 / 16; transform: rotate(-2deg); }
.clip.c9 { left: 54vw; top: 318vh; width: 38vw; aspect-ratio: 9 / 16; }
.clip.c10{ left: 20vw; top: 352vh; width: 20vw; aspect-ratio: 9 / 16; transform: rotate(3deg); }

@media (max-width: 760px) {
    .field { height: auto; display: flex; flex-direction: column; gap: 6vh; padding: 14vh 0 30vh; }
    .clip { position: relative; left: auto !important; top: auto !important; }
    .clip.c1, .clip.c3, .clip.c5, .clip.c7, .clip.c9 { width: 78vw !important; margin-left: 4vw; }
    .clip.c2, .clip.c4, .clip.c6, .clip.c8, .clip.c10 { width: 62vw !important; margin-left: 32vw; }
    h1 { bottom: 48px; }
}

/* ---------- sound ---------- */
.sound {
    position: fixed;
    right: 24px;
    bottom: 22px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--white);
    background: none;
    border: none;
    cursor: pointer;
    mix-blend-mode: difference;
}
.sound .wave { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
.sound .wave i { display: block; width: 2px; height: 2px; background: currentColor; }
.sound.playing .wave i { animation: bounce 0.9s ease-in-out infinite; }
.sound.playing .wave i:nth-child(2) { animation-delay: 0.15s; }
.sound.playing .wave i:nth-child(3) { animation-delay: 0.3s; }
.sound.playing .wave i:nth-child(4) { animation-delay: 0.45s; }
@keyframes bounce { 0%,100% { height: 2px; } 50% { height: 10px; } }
.sound:hover { text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>

<div class="corner tl"><a href="mystical-5cards.html">← diana olifirova</a></div>
<div class="corner tr">somatic practices<br>yoga<br>retreats</div>
<div class="corner bl">II</div>

<h1>move</h1>

<section class="field" aria-label="moving fragments">
    <a class="clip c1" href="#"><video src="../assets/didi/move/move-4.mp4" autoplay muted loop playsinline></video><span class="n">01</span></a>
    <a class="clip c2" href="#"><video src="../assets/didi/move/move-2.mp4" autoplay muted loop playsinline></video><span class="n">02</span></a>
    <a class="clip c3" href="#"><video src="../assets/didi/move/move-1.mp4" autoplay muted loop playsinline></video><span class="n">03</span></a>
    <a class="clip c4" href="#"><video src="../assets/didi/move/move-3.mp4" autoplay muted loop playsinline></video><span class="n">04</span></a>
    <a class="clip c5" href="#"><video src="../assets/didi/move/move-5.mp4" autoplay muted loop playsinline></video><span class="n">05</span></a>
    <a class="clip c6" href="#"><video src="../assets/didi/move/move-2.mp4" autoplay muted loop playsinline></video><span class="n">06</span></a>
    <a class="clip c7" href="#"><video src="../assets/didi/move/move-1.mp4" autoplay muted loop playsinline></video><span class="n">07</span></a>
    <a class="clip c8" href="#"><video src="../assets/didi/move/move-5.mp4" autoplay muted loop playsinline></video><span class="n">08</span></a>
    <a class="clip c9" href="#"><video src="../assets/didi/move/move-4.mp4" autoplay muted loop playsinline></video><span class="n">09</span></a>
    <a class="clip c10" href="#"><video src="../assets/didi/move/move-3.mp4" autoplay muted loop playsinline></video><span class="n">10</span></a>
</section>

<audio id="music" src="../assets/didi/move/move-music.mp3" loop preload="auto"></audio>
<button class="sound" id="sound" type="button" aria-label="music">
    <span class="wave"><i></i><i></i><i></i><i></i></span>
    <span class="label">sound</span>
</button>

<script>
// the music plays the whole time. browsers only allow sound after a first touch,
// so we try at once, and otherwise start on the first click or key anywhere.
(function () {
    const audio = document.getElementById('music');
    const btn = document.getElementById('sound');
    const label = btn.querySelector('.label');
    audio.volume = 0.7;
    function setState(playing) {
        btn.classList.toggle('playing', playing);
        label.textContent = playing ? 'sound on' : 'sound';
    }
    function tryPlay() {
        return audio.play().then(() => { setState(true); return true; }).catch(() => { setState(false); return false; });
    }
    function firstTouch() {
        if (audio.paused) tryPlay();
        window.removeEventListener('pointerdown', firstTouch);
        window.removeEventListener('keydown', firstTouch);
    }
    tryPlay().then(ok => {
        if (!ok) {
            window.addEventListener('pointerdown', firstTouch);
            window.addEventListener('keydown', firstTouch);
        }
    });
    btn.addEventListener('click', e => {
        e.stopPropagation();
        if (audio.paused) tryPlay(); else { audio.pause(); setState(false); }
    });
})();

// placeholders: the clips don't lead anywhere yet
document.querySelectorAll('.clip').forEach(c => c.addEventListener('click', e => e.preventDefault()));
</script>

</body>
